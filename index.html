function avatarUrl(filename){
  if(!filename) return null;
  return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/avatars/${filename}`;
}

let cachedAvatarList = null;
async function fetchAvatarList(){
  if(cachedAvatarList) return cachedAvatarList;
  try{
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/avatars?ref=${GITHUB_BRANCH}`);
    if(!res.ok){ cachedAvatarList = []; return []; }
    const data = await res.json();
    if(!Array.isArray(data)){ cachedAvatarList = []; return []; }
    cachedAvatarList = data
      .filter(f=>f.type==='file' && /\.(png|jpe?g|webp|gif)$/i.test(f.name))
      .map(f=>f.name);
    return cachedAvatarList;
  }catch(e){ console.error(e); cachedAvatarList = []; return []; }
}

// Verifies the token belongs to GITHUB_OWNER's own account. The real
// token is never stored in the site's code — it's only ever sent
// straight from the browser to GitHub itself.
async function verifyGithubOwner(token){
  try{
    const res = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if(!res.ok) return false;
    const data = await res.json();
    return !!(data && data.login && data.login.toLowerCase() === GITHUB_OWNER.toLowerCase());
  }catch(e){ console.error(e); return false; }
}

}
function randCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }
}
async function getRoom(code){
  try{
    const {data, error} = await sb.from('rooms').select('*').eq('code', code).maybeSingle();
    if(error || !data) return null;
    return {
      topic: data.topic,
      phase: data.phase,
      qIndex: data.q_index,
      qStartTs: Number(data.q_start_ts),
      playedCount: data.played_count,
      totalQuestions: data.total_questions,
      hostName: data.host_name
    };
  }catch(e){ console.error(e); return null; }
}
async function setRoom(code, obj){
  try{
    const {error} = await sb.from('rooms').upsert({
      code,
      topic: obj.topic,
      phase: obj.phase,
      q_index: obj.qIndex,
      q_start_ts: obj.qStartTs,
      played_count: obj.playedCount,
      total_questions: obj.totalQuestions,
      host_name: obj.hostName
    });
    if(error){ console.error(error); return false; }
    return true;
  }catch(e){ console.error(e); return false; }
}
async function listPlayers(code){
  try{
    const {data, error} = await sb.from('players').select('*').eq('room_code', code);
    if(error || !data) return [];
    return data.map(p=>({ name: p.name, safeName: p.safe_name, answers: p.answers || {}, joinedAt: Number(p.joined_at), avatar: p.avatar || null }));
  }catch(e){ console.error(e); return []; }
}
async function upsertPlayer(code, safeName, displayName, answers, avatar){
  try{
    const {error} = await sb.from('players').upsert({
      room_code: code,
      safe_name: safeName,
      name: displayName,
      answers: answers,
      joined_at: Date.now(),
      avatar: avatar || null
    });
    if(error){ console.error(error); return false; }
    return true;
  }catch(e){ console.error(e); return false; }
}
// Race-safe auto-advance: only succeeds if q_index still matches what this
// client last saw, so if several people's timers fire at once, only the
// first one actually moves the game forward.
async function tryAdvance(code, room, qs){
  const isLast = room.qIndex === qs.length - 1;
  const patch = isLast
    ? { phase:'ended' }
    : { q_index: room.qIndex+1, q_start_ts: Date.now(), played_count: room.qIndex+2 };
  try{
    await sb.from('rooms').update(patch).eq('code', code).eq('q_index', room.qIndex);
  }catch(e){ console.error(e); }
}

function render(html){ document.getElementById('root').innerHTML = html; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Basic copy/inspect-selection deterrent: blocks right-click, text
// selection, and copy on the given elements. Doesn't stop someone using
// browser dev tools, just the easy "select & search" shortcut.
function protectFromCopy(selector){
  document.querySelectorAll(selector).forEach(el=>{
    el.addEventListener('contextmenu', e=>e.preventDefault());
    el.addEventListener('copy', e=>e.preventDefault());
    el.addEventListener('selectstart', e=>e.preventDefault());
    el.addEventListener('dragstart', e=>e.preventDefault());
  });
}

// Renders a pickable grid of avatars into #containerId. Clicking one sets
// containerEl.dataset.selected to its filename ("" means no avatar).
async function renderAvatarPicker(containerId, preselected){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.dataset.selected = preselected || "";
  el.innerHTML = `<p class="muted" style="text-align:right;margin:0 0 8px;">در حال بارگذاری آواتارها...</p>`;
  const list = await fetchAvatarList();
  const optionsHtml = [
    `<div class="avatar-option none-option ${!preselected?'selected':''}" data-file="">بدون<br>عکس</div>`,
    ...list.map(f=>`<div class="avatar-option ${preselected===f?'selected':''}" data-file="${f}"><img src="${avatarUrl(f)}" alt="" loading="lazy"></div>`)
  ].join('');
  if(list.length===0){
    el.innerHTML = `<div class="avatar-picker">${optionsHtml}</div><p class="muted" style="text-align:right;">هنوز آواتاری توی پوشه‌ی avatars آپلود نشده (اختیاریه).</p>`;
  }else{
    el.innerHTML = `<div class="avatar-picker">${optionsHtml}</div>`;
  }
  el.querySelectorAll('.avatar-option').forEach(opt=>{
    opt.onclick = ()=>{
      el.querySelectorAll('.avatar-option').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      el.dataset.selected = opt.getAttribute('data-file');
    };
  });
}

function avatarThumbHtml(name, avatar){
  if(avatar){
    return `<img class="lb-avatar" src="${avatarUrl(avatar)}" alt="">`;
  }
  const initial = escapeHtml((name||'?').trim().charAt(0) || '?');
  return `<span class="lb-avatar lb-avatar-fallback">${initial}</span>`;
}

// Renders the 2-column grid of up to MAX_PLAYERS player cards (avatar +
// name). statusMode 'live' colors the border red/green based on whether
// that player has answered qIndex yet; 'neutral' (lobby) skips coloring.
function renderPlayerGrid(players, statusMode, qIndex){
  if(!players.length) return '';
  return `<div class="player-grid">${players.map(p=>{
    let cls = 'player-card';
    if(statusMode==='live'){
      const answered = p.answers && (qIndex in p.answers || String(qIndex) in p.answers);
      cls += answered ? ' status-answered' : ' status-waiting';
    }
    const avatarInner = p.avatar
      ? `<img src="${avatarUrl(p.avatar)}" alt="">`
      : `<span class="fallback">${escapeHtml((p.name||'?').trim().charAt(0) || '?')}</span>`;
    return `<div class="${cls}">
      <div class="avatar-box">${avatarInner}</div>
      <div class="pname">${escapeHtml(p.name)}</div>
    </div>`;
  }).join('')}</div>`;
}

// ---------------------------------------------------------------
// CREATE ROOM FLOW (creator also plays)
// ---------------------------------------------------------------
function screenCreateSetup(){
  stopPolling();
  const topicOpts = Object.keys(TOPICS).map(id=>`<option value="${id}">${TOPICS[id].name}</option>`).join('');
  const savedToken = localStorage.getItem('qr_gh_token') || '';
  render(`
    <h2>ساخت اتاق جدید</h2>
    <label>اسمت (برای بازی کردن)</label>
    <input type="text" id="nameInput" placeholder="مثلاً: علی" maxlength="20">
    <label>عکس پروفایل</label>
    <div id="avatarPicker"></div>
    <label>موضوع کوییز</label>
    <select id="topicSel">${topicOpts}</select>
    <label>GitHub Token (فقط برای ساخت اتاق لازمه)</label>
    <input type="password" id="tokenInput" placeholder="ghp_..." value="${escapeHtml(savedToken)}">
    <div id="createError" class="error-text hidden"></div>
    <button class="btn btn-primary" id="btnCreate">ساخت اتاق</button>
    <button class="link-btn" id="btnBack">بازگشت</button>
  `);
  renderAvatarPicker('avatarPicker', null);
  document.getElementById('btnBack').onclick = screenLanding;
  document.getElementById('btnCreate').onclick = async ()=>{
    const name = document.getElementById('nameInput').value.trim();
    const token = document.getElementById('tokenInput').value.trim();
    const errEl = document.getElementById('createError');
    errEl.classList.add('hidden');
    if(!name){ errEl.textContent="اسمت رو وارد کن."; errEl.classList.remove('hidden'); return; }
    if(!token){ errEl.textContent="برای ساخت اتاق باید GitHub Token وارد کنی."; errEl.classList.remove('hidden'); return; }
    const btn = document.getElementById('btnCreate');
    btn.disabled = true; btn.textContent = "در حال بررسی توکن...";
    const isOwner = await verifyGithubOwner(token);
    if(!isOwner){
      errEl.textContent = "این توکن معتبر نیست یا مال حساب مجاز نیست.";
      errEl.classList.remove('hidden');
      btn.disabled=false; btn.textContent="ساخت اتاق";
      return;
    }
    localStorage.setItem('qr_gh_token', token);
    btn.textContent = "در حال ساخت...";
    const avatarEl = document.getElementById('avatarPicker');
    const chosenAvatar = avatarEl ? (avatarEl.dataset.selected || null) : null;
    const topicId = document.getElementById('topicSel').value;
    let code, existing;
    do{
      code = randCode();
      existing = await getRoom(code);
    } while(existing);
    const safeName = safeKey(name);
    const total = TOPICS[topicId].questions.length;
    const ok = await setRoom(code, {
      topic: topicId, phase:'lobby', qIndex:-1, qStartTs:0, playedCount:0,
      totalQuestions: total, hostName: safeName
    });
    if(!ok){ btn.disabled=false; btn.textContent="ساخت اتاق"; alert("مشکلی پیش اومد، دوباره امتحان کن."); return; }
    myAnswers = {};
    myAvatar = chosenAvatar;
    await upsertPlayer(code, safeName, name, {}, myAvatar);
    screenLobby(code, safeName, name, topicId);
  };
}

  document.getElementById('btnJoinRoom').onclick = async ()=>{
    const name = document.getElementById('nameInput').value.trim();

    errEl.classList.add('hidden');

    const btn = document.getElementById('btnJoinRoom');
    btn.disabled = true; btn.textContent = "در حال بررسی...";

      errEl.classList.remove('hidden');
      btn.disabled=false; btn.textContent="ورود";
      return;

    const safeName = safeKey(name);
    const players = await listPlayers(code);

      errEl.textContent = `این اتاق پره (حداکثر ${MAX_PLAYERS} بازیکن).`;
      errEl.classList.remove('hidden');
      btn.disabled=false; btn.textContent="ورود";
      return;
    }
    const avatarEl = document.getElementById('avatarPicker');
    const chosenAvatar = avatarEl ? (avatarEl.dataset.selected || null) : null;
    myAnswers = {};
    myAvatar = chosenAvatar;
    await upsertPlayer(code, safeName, name, {}, myAvatar);
    screenLobby(code, safeName, name, room.topic);
  };
}

// ---------------------------------------------------------------
// LOBBY (shared screen for the creator and everyone who joins)
// ---------------------------------------------------------------
function screenLobby(code, safeName, displayName, topicId){
  stopPolling();
  render(`
    <div class="top-bar"><span class="badge badge-medium">${escapeHtml(TOPICS[topicId].name)}</span><span class="muted" style="margin:0;">اسمت: ${escapeHtml(displayName)}</span></div>
    <p class="muted" style="margin-top:0;">این کد رو با دوستات به اشتراک بذار</p>
    <div class="code-display">${code}</div>
    <div id="playerArea"><p class="muted">در انتظار پیوستن بازیکن‌ها...</p></div>
    <div id="startArea"></div>
    <button class="link-btn" id="btnCancel">بازگشت به صفحه اصلی</button>
  `);
  document.getElementById('btnCancel').onclick = screenLanding;

  const refresh = async ()=>{
    const room = await getRoom(code);
    if(!room) return;
    if(room.phase==='playing' || room.phase==='ended'){
      stopPolling();
      screenGame(code, safeName, displayName, topicId);
      return;
    }
    const players = await listPlayers(code);
    const area = document.getElementById('playerArea');
    if(area){
      if(players.length===0){
        area.innerHTML = `<p class="muted">در انتظار پیوستن بازیکن‌ها...</p>`;
      }else{
        area.innerHTML = `<p class="muted" style="text-align:right;">${players.length} از ${MAX_PLAYERS} نفر پیوستن:</p>
          ${renderPlayerGrid(players, 'neutral', -1)}`;
      }
    }
    const startArea = document.getElementById('startArea');
    if(startArea && !startArea.dataset.rendered){
      startArea.dataset.rendered = "1";
      if(room.hostName===safeName){
        startArea.innerHTML = `<button class="btn btn-primary" id="btnStart">شروع بازی</button>`;
        document.getElementById('btnStart').onclick = async ()=>{
          const btn = document.getElementById('btnStart');
          btn.disabled = true; btn.textContent = "در حال شروع...";
          const players2 = await listPlayers(code);
          if(players2.length<=1 && !confirm("هنوز کسی دیگه‌ای وارد نشده. بازی رو شروع کنم؟")){
            btn.disabled=false; btn.textContent="شروع بازی"; return;
          }
          const r = await getRoom(code);
          r.phase='playing'; r.qIndex=0; r.qStartTs=Date.now(); r.playedCount=1;
          await setRoom(code, r);
          stopPolling();
          screenGame(code, safeName, displayName, topicId);
        };
      }else{
        startArea.innerHTML = `<p class="muted">در انتظار شروع بازی توسط میزبان...</p>`;
      }
    }
  };
  refresh();
  pollTimer = setInterval(refresh, 2000);
}

// ---------------------------------------------------------------
// GAME (shared screen — the creator plays here too; a 12s timer
// per question auto-advances everyone to the next one)
// ---------------------------------------------------------------
async function screenGame(code, safeName, displayName, topicId){
  stopPolling();
  const room = await getRoom(code);
  if(!room) return screenLanding();
  if(room.phase==='ended'){ return screenEnded(code, topicId); }

  const qs = TOPICS[topicId].questions;
  const q = qs[room.qIndex];
  const already = myAnswers[room.qIndex] !== undefined;
  const badgeClass = q.level==='easy'?'badge-easy':(q.level==='medium'?'badge-medium':'badge-hard');
  advanceAttempted = false;

  const dots = qs.map((_,i)=>{
    let cls='dot';
    if(i<room.qIndex) cls+=' done';
    if(i===room.qIndex) cls+=' current';
    return `<span class="${cls}"></span>`;
  }).join('');

  render(`
    <div class="top-bar">
      <span class="badge ${badgeClass}">${LEVEL_FA[q.level]}</span>
      <div class="timer-wrap"><div class="timer-burst" id="timerBox">--</div></div>
    </div>
    <div class="progress-dots">${dots}</div>
    <p class="muted" style="margin-top:0;">سوال ${room.qIndex+1} از ${qs.length} · <span id="answerCount">در حال شمارش...</span></p>
    <div class="qtext no-select">${escapeHtml(q.q)}</div>
    <div class="choice-row no-select" id="choices">
      ${q.options.map((opt,i)=>`<button class="btn-choice" data-i="${i}" ${already?'disabled':''}>${escapeHtml(opt)}</button>`).join('')}
    </div>
    <p class="muted" id="statusMsg">${already ? 'جوابت ثبت شده، منتظر بمون...' : 'یکی از گزینه‌ها رو انتخاب کن'}</p>
    <div id="playerGridArea"></div>
  `);

  protectFromCopy('.qtext, .btn-choice');

  if(already){
    const el = document.querySelector(`#choices [data-i="${myAnswers[room.qIndex]}"]`);
    if(el) el.classList.add('selected');
  }

  document.querySelectorAll('#choices .btn-choice').forEach(btn=>{
    btn.onclick = async ()=>{
      if(myAnswers[room.qIndex] !== undefined) return;
      const i = parseInt(btn.getAttribute('data-i'));
      const remaining = QUESTION_DURATION - (Date.now()-room.qStartTs)/1000;
      if(remaining<=0) return;
      myAnswers[room.qIndex] = i;
      document.querySelectorAll('#choices .btn-choice').forEach(b=>{b.disabled=true;});
      btn.classList.add('selected');
      document.getElementById('statusMsg').textContent = 'جوابت ثبت شده، منتظر بمون...';
      await upsertPlayer(code, safeName, displayName, myAnswers, myAvatar);
    };
  });

  const tick = ()=>{
    const remaining = Math.max(0, QUESTION_DURATION - (Date.now()-room.qStartTs)/1000);
    const box = document.getElementById('timerBox');
    if(box){
      box.textContent = Math.ceil(remaining);
      box.classList.toggle('low', remaining<=4);
    }
    if(remaining<=0){
      document.querySelectorAll('#choices .btn-choice').forEach(b=>{b.disabled=true;});
      if(myAnswers[room.qIndex]===undefined){
        const sm = document.getElementById('statusMsg');
        if(sm) sm.textContent = 'زمان تموم شد!';
      }
      if(!advanceAttempted){
        advanceAttempted = true;
        tryAdvance(code, room, qs);
      }
    }
  };
  tick();
  countdownTimer = setInterval(tick, 250);

  const refreshCount = async ()=>{
    const players = await listPlayers(code);
    const answered = players.filter(p=>p.answers && (room.qIndex in p.answers || String(room.qIndex) in p.answers)).length;
    const el = document.getElementById('answerCount');
    if(el) el.textContent = `${answered} از ${players.length} نفر جواب دادن`;
    const gridArea = document.getElementById('playerGridArea');
    if(gridArea) gridArea.innerHTML = renderPlayerGrid(players, 'live', room.qIndex);
  };
  refreshCount();

  pollTimer = setInterval(async ()=>{
    refreshCount();
    const r = await getRoom(code);
    if(!r) return;
    if(r.phase==='ended'){ stopPolling(); return screenEnded(code, topicId); }
    if(r.qIndex !== room.qIndex){ stopPolling(); return screenGame(code, safeName, displayName, topicId); }
  }, 1000);
}

// ---------------------------------------------------------------
// LEADERBOARD / END (shared final screen for everyone)
// ---------------------------------------------------------------
async function computeLeaderboard(code, topicId){
  const qs = TOPICS[topicId].questions;
  const players = await listPlayers(code);
  const room = await getRoom(code);
  const total = (room && room.playedCount) ? room.playedCount : qs.length;
  return players.map(p=>{
    let correct=0, wrong=0, unanswered=0;
    for(let i=0;i<total;i++){
      const given = p.answers ? p.answers[i] : undefined;
      if(given===undefined || given===null){ unanswered++; }
      else if(given===qs[i].correct){ correct++; }
      else{ wrong++; }
    }
    return {name:p.name, avatar:p.avatar, correct, wrong, unanswered};
  }).sort((a,b)=> b.correct-a.correct || a.wrong-b.wrong);
}

async function screenEnded(code, topicId){
  stopPolling();
  render(`<div class="center-msg"><span class="big">در حال محاسبه نتایج...</span></div>`);
  const leaderboard = await computeLeaderboard(code, topicId);
  const qs = TOPICS[topicId].questions;
  const total = qs.length;
  let correct=0, wrong=0, unanswered=0;
  for(let i=0;i<total;i++){
    const given = myAnswers[i];
    if(given===undefined){ unanswered++; }
    else if(given===qs[i].correct){ correct++; }
    else{ wrong++; }
  }
  render(`
    <h2>نتیجه‌ی تو</h2>
    <div class="stat-row">
      <div class="stat-box"><div class="num go-color">${correct}</div><div class="lbl">درست</div></div>
      <div class="stat-box"><div class="num blaze-color">${wrong}</div><div class="lbl">غلط</div></div>
      <div class="stat-box"><div class="num dim-color">${unanswered}</div><div class="lbl">بی‌جواب</div></div>
    </div>
    <h2>🏆 جدول کل بازیکن‌ها</h2>
  `);
  const container = document.getElementById('root');
  const rows = leaderboard.map((p,i)=>`
    <tr>
      <td class="${i===0?'rank1':''}">${i+1}</td>
      <td class="name">${avatarThumbHtml(p.name, p.avatar)}${escapeHtml(p.name)}</td>
      <td class="go-color">${p.correct}</td>
      <td class="blaze-color">${p.wrong}</td>
      <td class="dim-color">${p.unanswered}</td>
    </tr>`).join('');
  container.insertAdjacentHTML('beforeend', `
    <table class="results">
      <thead><tr><th>#</th><th>نام</th><th>درست</th><th>غلط</th><th>بی‌جواب</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <button class="btn btn-secondary" id="btnHome" style="margin-top:20px;">بازگشت به صفحه اصلی</button>
  `);
  document.getElementById('btnHome').onclick = screenLanding;
}
